; ==============================================================================
; CRM Enterprises - Supervisord Worker & Daemon Configuration
; Path: /etc/supervisor/conf.d/crm-enterprises.conf
; ==============================================================================

[program:crm-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/crm-enterprises/backend/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/crm-queue-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=3600

[program:crm-scheduler]
process_name=%(program_name)s
command=php /var/www/crm-enterprises/backend/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/crm-scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:crm-reverb-websockets]
process_name=%(program_name)s
command=php /var/www/crm-enterprises/backend/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/crm-reverb.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=60
