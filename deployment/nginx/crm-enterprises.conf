# ==============================================================================
# CRM Enterprises - Production Nginx Server Block Configuration
# Path: /etc/nginx/sites-available/crm-enterprises.conf
# ==============================================================================

# Upstream for PHP 8.3 FPM socket
upstream php-fpm {
    server unix:/run/php/php8.3-fpm.sock;
    keepalive 32;
}

# Upstream for Laravel Reverb WebSockets
upstream reverb {
    server 127.0.0.1:8080;
    keepalive 64;
}

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name app.crmenterprises.com admin.crmenterprises.com;

    # Allow Let's Encrypt / ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/crm-enterprises/backend/public;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.crmenterprises.com admin.crmenterprises.com;

    root /var/www/crm-enterprises/backend/public;
    index index.php index.html;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/app.crmenterprises.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.crmenterprises.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/app.crmenterprises.com/chain.pem;

    # TLS Protocols and Ciphers (Modern OWASP Profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Hardened Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:; frame-src 'self' https://api.razorpay.com;" always;

    # Payload & Buffer Limits
    client_max_body_size 64M;
    client_body_buffer_size 128k;

    # Gzip Compression Tuning
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2;

    # Logging
    access_log /var/log/nginx/crm-enterprises_access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/crm-enterprises_error.log warn;

    # Frontend Single Page Application / PWA static assets
    location ^~ /app/ {
        alias /var/www/crm-enterprises/frontend/dist/;
        try_files $uri $uri/ /app/index.html;
        
        # Static asset aggressive caching
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Service Worker & Manifest - Never Cache
        location ~* (?:service-worker\.js|manifest\.webmanifest|manifest\.json)$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Laravel Reverb WebSockets Proxy
    location ^~ /app/reverb {
        proxy_pass http://reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Backend API and Application Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300s;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(storage/logs|bootstrap/cache|config|database|resources|routes|tests) {
        deny all;
        return 404;
    }
}
